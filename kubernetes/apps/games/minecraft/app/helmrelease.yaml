---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app minecraft
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    timeout: 15m
    remediation:
      retries: 1
  interval: 1h
  maxHistory: 1
  upgrade:
    timeout: 15m
    remediation:
      retries: 1
  values:
    controllers:
      minecraft:
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 120
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        containers:
          app:
            image:
              repository: docker.io/itzg/minecraft-server
              tag: 2026.8.0-java25@sha256:e3335993929a1565f73c30b2041bcbc1473fc9c406fdd5a0d0ea24c08ef73320
            env:
              TZ: Asia/Singapore
              EULA: "TRUE"
              TYPE: FABRIC
              VERSION: "26.2"
              FABRIC_LOADER_VERSION: "0.19.3"
              FABRIC_LAUNCHER_VERSION: "1.1.2"
              LEVEL: minecraft-26-2
              MODE: survival
              FORCE_GAMEMODE: "false"
              DIFFICULTY: hard
              HARDCORE: "false"
              ALLOW_NETHER: "true"
              SPAWN_PROTECTION: "0"
              SERVER_IP: ""
              SERVER_PORT: "25565"
              ENABLE_COMMAND_BLOCK: "false"
              MAX_PLAYERS: "10"
              OPS: Strxnd
              EXISTING_OPS_FILE: MERGE
              MEMORY: 6G
              VIEW_DISTANCE: "10"
              SIMULATION_DISTANCE: "8"
              ENABLE_RCON: "false"
              MOTD: Kumar's modded survival server
              # Exact Modrinth version IDs resolved from the server-compatible
              # projects represented in ~/Downloads/mods.zip for Minecraft 26.2.
              MODRINTH_PROJECTS: |-
                fabric:axiom:QO99kC52
                fabric:carpet:bGrLxJ8v
                fabric:carpet-tis-addition:lW1s6HL1
                fabric:elytra-trims:xe4XXryG
                fabric:fabric-api:vmQp7ixA
                fabric:fabric-language-kotlin:bdhiINYC
                fabric:ferrite-core:d5ddUdiB
                fabric:g4mespeed:KwnkHbt9
                fabric:lithium:f7vZ0VWU
                fabric:syncmatica:f74T22XS
                fabric:worldedit:6YnCYPwc
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 25565
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 90
            resources:
              requests:
                cpu: 2000m
                memory: 7Gi
              limits:
                cpu: 4000m
                memory: 8Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "192.168.20.11"
        externalTrafficPolicy: Local
        ports:
          minecraft:
            port: *port
            protocol: TCP
    persistence:
      data:
        type: persistentVolumeClaim
        suffix: 26-2
        accessMode: ReadWriteOnce
        size: 20Gi
        storageClass: local-path
        retain: true
        globalMounts:
          - path: /data
