---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app minecraft
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    timeout: 10m
    remediation:
      retries: 1
  interval: 1h
  maxHistory: 1
  upgrade:
    timeout: 10m
    remediation:
      retries: 1
  values:
    controllers:
      minecraft:
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 120
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        containers:
          app:
            image:
              repository: docker.io/itzg/minecraft-server
              tag: 2026.8.0-java21@sha256:b76b9298a2a60d5cf9d223e009cd0b8ad620c2080abd83f9a1fa5084fa87f9ab
            env:
              TZ: Asia/Singapore
              EULA: "TRUE"
              TYPE: VANILLA
              VERSION: "1.21.11"
              LEVEL: world-1.21.11
              MODE: survival
              DIFFICULTY: hard
              HARDCORE: "true"
              MAX_PLAYERS: "10"
              OPS: Strxnd
              EXISTING_OPS_FILE: MERGE
              MEMORY: 6G
              VIEW_DISTANCE: "10"
              SIMULATION_DISTANCE: "8"
              ENABLE_RCON: "false"
              MOTD: Kumar's survival server
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 25565
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 2000m
                memory: 7Gi
              limits:
                cpu: 4000m
                memory: 8Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
        initContainers:
          enable-hardcore:
            image:
              repository: docker.io/library/python
              tag: 3.13.13-alpine3.23@sha256:420cd0bf0f3998275875e02ecd5808168cf0843cbb4d3c536432f729247b2acc
            command:
              - python
              - -c
            args:
              - |
                import gzip
                import os
                import shutil
                from pathlib import Path

                world = Path("/data/world-1.21.11")
                marker = b"\x01\x00\x08hardcore"

                for filename in ("level.dat", "level.dat_old"):
                    path = world / filename
                    if not path.exists():
                        if filename == "level.dat":
                            raise FileNotFoundError(path)
                        continue

                    data = bytearray(gzip.decompress(path.read_bytes()))
                    position = data.find(marker)
                    if position == -1 or data.find(marker, position + 1) != -1:
                        raise RuntimeError(f"Expected one hardcore tag in {path}")

                    value = position + len(marker)
                    if data[value] == 1:
                        print(f"Hardcore already enabled in {path}")
                        continue
                    if data[value] != 0:
                        raise RuntimeError(f"Unexpected hardcore value in {path}")

                    backup = path.with_name(f"{filename}.pre-hardcore")
                    if not backup.exists():
                        shutil.copy2(path, backup)

                    temporary = path.with_name(f".{filename}.hardcore.tmp")
                    data[value] = 1
                    temporary.write_bytes(gzip.compress(bytes(data), mtime=0))
                    shutil.copystat(path, temporary)
                    os.replace(temporary, path)
                    print(f"Enabled hardcore in {path}")
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: "mc.${SECRET_DOMAIN}"
          lbipam.cilium.io/ips: "192.168.20.11"
        externalTrafficPolicy: Cluster
        ports:
          minecraft:
            port: *port
            protocol: TCP
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 20Gi
        storageClass: local-path
        globalMounts:
          - path: /data
