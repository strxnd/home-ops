---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app minecraft
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    timeout: 10m
    remediation:
      retries: 1
  upgrade:
    timeout: 10m
    remediation:
      retries: 1
  values:
    fullnameOverride: *app

    replicaCount: 1
    workloadAsStatefulSet: true
    # StatefulSets do not support Recreate; OnDelete gives the requested
    # controlled, single-pod replacement semantics for this RWO workload.
    strategyType: OnDelete

    image:
      repository: ghcr.io/itzg/minecraft-server
      tag: java25@sha256:bb6954740804e0384087689e0eb1710fe8a99a4060088da27c79389a0092d1da
      pullPolicy: IfNotPresent

    resources:
      requests:
        cpu: 500m
        memory: 8Gi
      limits:
        cpu: 8000m
        memory: 8Gi

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault

    persistence:
      storageClass: local-path
      dataDir:
        enabled: true
        Size: 100Gi

    livenessProbe:
      initialDelaySeconds: 180
      periodSeconds: 10
      failureThreshold: 30
    readinessProbe:
      initialDelaySeconds: 120
      periodSeconds: 10
      failureThreshold: 30
    startupProbe:
      enabled: true
      failureThreshold: 60
      periodSeconds: 10

    extraEnv:
      TZ: Asia/Kolkata
      ENABLE_ROLLING_LOGS: "true"
      RCON_CMDS_STARTUP: |-
        worldborder center 0 0
        worldborder set 4000
        execute in minecraft:the_nether run worldborder center 0 0
        execute in minecraft:the_nether run worldborder set 4000
        execute in minecraft:the_end run worldborder center 0 0
        execute in minecraft:the_end run worldborder set 4000
        gamerule minecraft:locator_bar false
        smpUtils maceDamageCap set 16

    minecraftServer:
      eula: true
      difficulty: hard
      type: PAPER
      mode: survival
      pvp: true
      version: "26.2"
      levelSeed: "-3085124641489919468"
      worldSaveName: world
      motd: "LifeSteal SMP"
      memory: 6G
      allowNether: true
      serviceType: ClusterIP
      servicePort: 25565
      rcon:
        enabled: true
        withGeneratedPassword: false
        existingSecret: minecraft-rcon
        secretKey: rcon-password
        port: 25575
        serviceType: ClusterIP
      autoCurseForge:
        apiKey:
          existingSecret: minecraft-rcon
      modrinth:
        projects:
          - "l8Uv7FzS:DqixaESV" # LifeStealZ 2.21.1
          - "NiJ6gIEq:lO8gD88d" # ItemControl 1.2.0
          - "pq075IyY:jYThZAg2" # Item Limiter 3.3
          - "GggKSyTG:9VsFtEzu" # Mace Config 0.2.2
          - "Mb7K785l:qwyXkD8V" # SMPUtils+ 1.5; 1.21.x listing, staging gate
          - "j2g3fqUV:t8bMoUaC" # CartLimiter 1.7
          - "LI8sodAD:xrvVOux2" # Simple Combat Log 1.19; keeps projectile/explosion combat tagging
          # - "GJZRngyV:2zviFooQ" # DISABLED: KaiCore/CombatLog cover its flight restrictions
          - "Lu3KuzdV:Kma0kBsY" # CoreProtect 24.0; 26.2 staging gate
          - "LJNGWSvH:fbt7nJt5" # Grim 2.3.74-2614909
          # - "YD56Nhy5:ikKvjBcF" # DISABLED: no active recipes; the chestplate uses the datapack
          - "kV8iMq85:yCPbvC8z" # KaiCore 1.5
        downloadDependencies: none
        allowedVersionType: release

    initContainers:
      - name: minecraft-bootstrap
        image: ghcr.io/itzg/minecraft-server:java25@sha256:bb6954740804e0384087689e0eb1710fe8a99a4060088da27c79389a0092d1da
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -ec
          - |
            copy_if_missing() {
              if [ ! -f "$2" ]; then
                cp "$1" "$2"
              fi
            }

            mkdir -p \
              /data/plugins/LifeStealZ \
              /data/plugins/ItemControl \
              /data/plugins/notdqshers-item-limiter \
              /data/plugins/MaceConfig \
              /data/plugins/SMPUtils \
              /data/plugins/CartLimiter \
              /data/plugins/CombatLog \
              /data/plugins/No-Flight-In-PVP \
              /data/plugins/CustomRecipes \
              /data/plugins/KaiCore

            # Keep disabled jars on the PVC for a reversible rollback, but do
            # not leave them with a .jar suffix for Paper to load.
            for jar in /data/plugins/No\ Flight\ In\ PVP-*.jar /data/plugins/customRecipes.jar; do
              if [ -f "$jar" ]; then
                mv "$jar" "$jar.disabled"
              fi
            done

            copy_if_missing /config/lifestealz-config.yml /data/plugins/LifeStealZ/config.yml
            copy_if_missing /config/lifestealz-items.yml /data/plugins/LifeStealZ/items.yml
            copy_if_missing /config/itemcontrol-config.yml /data/plugins/ItemControl/config.yml
            copy_if_missing /config/item-limiter-config.yml /data/plugins/notdqshers-item-limiter/config.yml
            copy_if_missing /config/mace-config.yml /data/plugins/MaceConfig/config.yml
            copy_if_missing /config/smputils-config.yml /data/plugins/SMPUtils/config.yml
            copy_if_missing /config/cartlimiter-config.yml /data/plugins/CartLimiter/config.yml
            copy_if_missing /config/combatlog-config.yml /data/plugins/CombatLog/config.yml
            copy_if_missing /config/no-flight-in-pvp-config.yml /data/plugins/No-Flight-In-PVP/config.yml
            copy_if_missing /config/customrecipes-config.yml /data/plugins/CustomRecipes/config.yml
            copy_if_missing /config/kaicore-config.yml /data/plugins/KaiCore/config.yml

            mkdir -p /data/world/datapacks/lifesteal-smp/data/lifesteal/recipe
            copy_if_missing /config/datapack-pack.mcmeta /data/world/datapacks/lifesteal-smp/pack.mcmeta
            copy_if_missing /config/datapack-dragon-egg-chestplate.json /data/world/datapacks/lifesteal-smp/data/lifesteal/recipe/dragon_egg_chestplate.json
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
          - name: datadir
            mountPath: /data
          - name: minecraft-config
            mountPath: /config
            readOnly: true

    extraVolumes:
      - volumeMounts:
          - name: minecraft-config
            mountPath: /config
            readOnly: true
        volumes:
          - name: minecraft-config
            configMap:
              name: minecraft-plugin-config
