---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-public
  annotations:
    lbipam.cilium.io/ips: "192.168.20.11"
    external-dns.alpha.kubernetes.io/hostname: "mc.${SECRET_DOMAIN}"
    external-dns.alpha.kubernetes.io/target: "${SECRET_PUBLIC_IP}"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: minecraft
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
