mace:
  max-count: 1
  cooldown-seconds: 0
  enchantable: true
  whitelisted-enchants:
    - density
    - breach
    - wind_burst
  enchant-max-levels:
    density: 2
    breach: 3
    wind_burst: 1

wielder:
  color: GOLD
  glow:
    enabled: false
  tab-list:
    enabled: false
  reveal:
    enabled: false
    interval-seconds: 300

announcements:
  mace-crafted:
    chat-enabled: true
  all-maces-crafted:
    chat-enabled: true
    title-enabled: true
  messages:
    all-maces-crafted: "<gold>Mace limit reached"
    mace-crafted: "<yellow>{player} crafted a mace. <gray>({count}/{limit})"
    cooldown-blocked: "<red>The mace is on cooldown for {seconds}s."
    enchant-blocked: "<red>That enchantment is not allowed on maces."
    position-reveal: "<gold>Mace wielder {player}: <yellow>{world} {x} {y} {z}"

update-checker:
  enabled: false
  message: ""
