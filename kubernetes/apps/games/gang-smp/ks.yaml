---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gang-smp
  namespace: games
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: gang-smp
  dependsOn:
    - name: local-path-provisioner
      namespace: kube-system
  interval: 1h
  path: ./kubernetes/apps/games/gang-smp
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: games
  timeout: 15m
  wait: true
