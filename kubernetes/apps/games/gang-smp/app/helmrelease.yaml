---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app gang-smp
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    timeout: 15m
    remediation:
      retries: 1
  interval: 1h
  maxHistory: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 1
  values:
    controllers:
      gang-smp:
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 120
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        initContainers:
          check-world:
            image:
              repository: docker.io/itzg/minecraft-server
              tag: &imageTag 2026.8.0-java25@sha256:e3335993929a1565f73c30b2041bcbc1473fc9c406fdd5a0d0ea24c08ef73320
            command: [/bin/sh, -ec]
            args:
              - test -f /data/world/level.dat || { echo 'Import the Aternos world to /data/world before starting'; exit 1; }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: docker.io/itzg/minecraft-server
              tag: *imageTag
            env:
              TZ: Asia/Singapore
              EULA: "TRUE"
              TYPE: FABRIC
              VERSION: "26.3"
              FABRIC_LOADER_VERSION: "0.19.5"
              LEVEL: world
              MODE: survival
              FORCE_GAMEMODE: "false"
              DIFFICULTY: easy
              HARDCORE: "false"
              ALLOW_NETHER: "true"
              ALLOW_FLIGHT: "true"
              SPAWN_PROTECTION: "0"
              SERVER_IP: ""
              SERVER_PORT: "25565"
              ENABLE_COMMAND_BLOCK: "false"
              MAX_PLAYERS: "20"
              ONLINE_MODE: "true"
              OPS: Strxnd
              ENABLE_WHITELIST: "true"
              ENFORCE_WHITELIST: "true"
              WHITELIST: Strxnd,COOPHEGOD,JchanandDanchan
              MEMORY: 7G
              VIEW_DISTANCE: "5"
              SIMULATION_DISTANCE: "5"
              ENABLE_ROLLING_LOGS: "true"
              # RCON is used by the image locally, with no Service port.
              ENABLE_RCON: "true"
              PVP: "true"
              MOTD: Gang SMP
              DATAPACKS: https://cdn.modrinth.com/data/yjtGEwyb/versions/gkny6mFf/Faster%20Happy%20Ghasts%20V2.zip
              MODRINTH_DOWNLOAD_DEPENDENCIES: required
              MODRINTH_PROJECTS: |-
                fabric-api:bq3SsNGk
                fabric-language-kotlin:SKW1BTL3
                carpet:yt9oDFOj
                carpet-tis-addition:GN7VqWFY
                lithium:xS0Q8LSi
                ferrite-core:d5ddUdiB
                krypton:UugdIYJw
                spark:e3hsPc1o
                syncmatica:uT7TJ2Wp
                servux:azA4UG3T
                no-chat-reports:6g96avt2
                luckperms:DzQPkkXY
                vanilla-permissions:bpq3ZDRl
                elytra-trims:KiDLWRiF
                simple-voice-chat:OLnMVWXy
                viafabric:qiAP0t9R
                voxy-server-side:P5EImGnN
                clickvillagers:cBWjtfYp
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 25565
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 90
            resources:
              requests:
                cpu: 500m
                memory: 8Gi
              limits:
                cpu: 8000m
                memory: 10Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "192.168.20.13"
        externalTrafficPolicy: Local
        ports:
          minecraft:
            port: *port
            protocol: TCP
          voice-chat:
            port: 24454
            protocol: UDP
    persistence:
      data:
        type: persistentVolumeClaim
        suffix: aternos-26-3
        accessMode: ReadWriteOnce
        size: 50Gi
        storageClass: local-path
        retain: false
        globalMounts:
          - path: /data
