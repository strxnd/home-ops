# CombatLog declares this permission as operator-only by default. GLITG SMP
# must apply combat tagging and logout punishment to operators as well.
combatlog.bypass:
  description: CombatLog bypass is disabled on GLITG SMP.
  default: false

# Grace999 bundles a deathban system with no direct enable/disable toggle.
# Enable its permission-based bypass and grant that bypass to every player.
grace.deathban.ignore:
  description: Grace999 deathbans are disabled on GLITG SMP.
  default: true
