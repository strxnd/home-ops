  # delivery type has its own six-potion cap rather than all potions sharing one cap.
  item-limits:
    healing-potion:
      item:
        DataVersion: 4790
        id: minecraft:potion
        count: 1
        components:
          minecraft:potion_contents:
            potion: minecraft:healing
        schema_version: 1
      limit: 6
