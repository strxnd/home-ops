---
# Require the ClientID companion mod before a player can play.
requireMod: true

# Keep keyword matching narrow. These terms target hidden-information tools,
# automation, and well-known hacked-client names without blocking generic
# performance, rendering, cosmetic, or building mods.
keywordBans:
  - xray
  - x-ray
  - freecam
  - autoclick
  - auto-click
  - auto_click
  - meteor
  - liquidbounce
  - aristois
  - bleachhack
  - huzuni

# ClientID compares these entries with the exact mod IDs reported by the
# companion mod. IDs are case-insensitive. Litematica and MaLiLib are
# intentionally absent from this list.
blacklist:
  # Hidden-information and camera advantages
  - freecam
  - omniscience-awakened
  - camerautils
  - betterthirdperson
  - shouldersurfing

  # Known hacked clients and cheat-client identifiers
  - wurst
  - meteor-client
  - liquidbounce
  - aristois
  - bleachhack
  - huzuni
  - impact
  - future
  - inertia
  - thunderhack
  - lambda
  - kami
  - vape

  # Combat assistance and automation
  - autoclicker
  - autoswitch
  - armorhotswap
  - arrowshifter
  - arrow-shifter
  - arrow_shifter
  - bettermaceswap
  - clickcrystals
  - hazelcrystaloptimizer
  - kindscrystaloptimizer
  - walksycrystaloptimizer
  - walskycrystaloptimizer
  - maceattackassistance
  - maceoptimiser
  - switchtotems
  - dhandmod
  # Current Arrow Switcher project ID.
  - arrow-switcher

  # Inventory and hotbar automation
  - dokkos-hotbar-optimizer
  - double_hotbar
  - inventory
  - inventory_control_tweaks
  - inventorymanagement
  - inventoryprofilesnext
  - invmove
  - itemscroller
  - mousetweaks
  - mousewheelie
  - quick_hotkeys
  - quickcraft
  - slotcycler
  - sort
  - clientsort

  # Interaction, placement, and timing advantages
  - accurateblockplacement
  - bridgingmod
  - tweakeroo
  - fvt
  - fluidlogged
  - multi-key-bindings
  - nodelaymod
  - noinputlagtickrate
  - quickmath

  # XP, elytra, and other automation
  - fast-xp
  - quickexp
  - autoelytra
  - autoelytraflight
  - quickelytra
  - quick_elytra
  - bedrockify
  - betterscreens
  - clientcommands
  - client-commands

# No allow-list is used. These are only bypasses for entries in the lists
# above, so leaving them empty preserves the blacklist-based policy.
whitelist: []
playerBypass: []
reversePlayerBypass: false

# Leave the chart available and keep the reported mod list in the server log
# for admin review when a player is rejected.
disablePieChart: false
logModsOnJoin: true
