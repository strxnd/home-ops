# GLITG SMP uses one server-wide launch grace period.
grace-duration-seconds: 3600
auto-start-duration-seconds: 3600
# The one-time launch grace has elapsed; do not restart it after routine
# container restarts. Admins can start a new grace period explicitly.
auto-start: false

# Runtime state is maintained by Grace999 on the persistent data volume.
grace-active: false
grace-end-time: 0

# Do not grant independent grace timers to players who join later.
per-player-grace-enabled: false
grace-starts-from-join: false

# Only PvP is restricted during launch grace.
no-damage-everything: false
no-hunger-loss: false

# Grace999 has no direct deathban toggle. Enabling its permission check lets
# permissions.yml grant grace.deathban.ignore to every player.
deathban:
  ignore-permission: true

default-flags:
  # The active grace timer blocks PvP separately. Keep the inactive baseline
  # permissive so PvP is restored after the timer ends.
  allow-pvp: true
  allow-block-breaking: true
  allow-block-placing: true
  allow-mob-damage: true
  allow-mob-spawning: true
  allow-player-damage: true
  allow-commands: true
  allow-flight: false
  allow-item-drop: true
  allow-item-pickup: true

worlds:
  world:
    grace-enabled: true
    duration: 3600
    flags:
      allow-pvp: true
  world_nether:
    grace-enabled: true
    duration: 3600
    flags:
      allow-pvp: true
  world_the_end:
    grace-enabled: true
    duration: 3600
    flags:
      allow-pvp: true
