# These entries are the built-in checks shipped by CheckHacks v1.2.1.
# Do not add generic translation or keybind names here. Unsupported GLITG
# entries are recorded in DETECTION-COVERAGE.md instead of using guesses.
hacks:
  meteor-client:
    display-name: "Meteor Client"
    key: "key.meteor-client.open-gui"
    mode: METEOR

  liquidbounce:
    display-name: "LiquidBounce"
    key: "liquidbounce.module.killaura.name"
    mode: TRANSLATE

  freecam:
    display-name: "Freecam"
    key: "key.freecam.toggle"
    mode: KEYBIND

  wurst:
    display-name: "Wurst Client (-1.21)"
    key: "key.wurst.zoom"
    mode: KEYBIND

  xray-fabric:
    display-name: "XRay (Fabric)"
    key: "xray.config.toggle"
    mode: KEYBIND

  chestesp:
    display-name: "ChestESP"
    key: "key.chestesp.toggle"
    mode: KEYBIND

  killaura-fabric:
    display-name: "KillAura (Fabric)"
    key: "key.killaura"
    mode: KEYBIND

  autofish:
    display-name: "AutoFish"
    key: "key.autofish.open_gui"
    mode: KEYBIND

  lumina:
    display-name: "Lumina"
    key: "key.lumina.open_click_gui"
    mode: KEYBIND

  autoswitch:
    display-name: "AutoSwitch"
    key: "key.autoswitch.toggle"
    mode: KEYBIND

  bleachhack:
    display-name: "BleachHack"
    key: "bleachhack.module.killaura"
    mode: TRANSLATE

  aristois:
    display-name: "Aristois"
    key: "emc.module.killaura.name"
    mode: TRANSLATE

  coffee:
    display-name: "Coffee Client"
    key: "coffee.module.killaura.name"
    mode: TRANSLATE

  world-downloader:
    display-name: "World Downloader"
    key: "key.wdl.startStop"
    mode: TRANSLATE

  autoclicker-fabric:
    display-name: "AutoClicker (Fabric)"
    key: "autoclicker-fabric.hud.holding"
    mode: TRANSLATE

  antiafk:
    display-name: "AntiAFK"
    key: "key.antiafk.toggle"
    mode: TRANSLATE

  auto-clicker-mc:
    display-name: "Auto Clicker (p1k0chu)"
    key: "key.auto-clicker_.toggle"
    mode: KEYBIND

# Manual checks use the full verified built-in set.
default-check-hacks:
  - meteor-client
  - liquidbounce
  - freecam
  - wurst
  - xray-fabric
  - chestesp
  - killaura-fabric
  - autofish
  - lumina
  - autoswitch
  - bleachhack
  - aristois
  - coffee
  - world-downloader
  - autoclicker-fabric
  - antiafk
  - auto-clicker-mc

# CheckHacks schedules this supported join check 60 ticks after PlayerJoinEvent
# in v1.2.1. It runs on every connection, not only a player's first join.
auto-check-on-join:
  enabled: true
  only-first-join: false
  hacks:
    - meteor-client
    - liquidbounce
    - freecam
    - wurst
    - xray-fabric
    - chestesp
    - killaura-fabric
    - autofish
    - lumina
    - autoswitch
    - bleachhack
    - aristois
    - coffee
    - world-downloader
    - autoclicker-fabric
    - antiafk
    - auto-clicker-mc

# CheckHacks hooks Grim's supported FlagEvent. A one-hour cooldown prevents
# repeated Grim flags from starting a scan for every individual violation.
detect-flag:
  enabled: true
  anticheats:
    grim: true
    vulcan: false
    spartan: false
  cooldown-hours: 1
  hacks:
    - meteor-client
    - liquidbounce
    - freecam
    - wurst
    - xray-fabric
    - chestesp
    - killaura-fabric
    - autofish
    - lumina
    - autoswitch
    - bleachhack
    - aristois
    - coffee
    - world-downloader
    - autoclicker-fabric
    - antiafk
    - auto-clicker-mc

# Only a confirmed DETECTED result triggers a kick. CheckHacks always logs and
# alerts PROTECTED and SKIPPED results, but neither result is treated as clean
# or punished automatically.
command-if-positive:
  enabled: true
  command: "kick %player% A prohibited client mod was detected. Remove the prohibited mod and restart Minecraft before reconnecting. See the GLITG rules for the client-mod policy."

command-if-protected:
  enabled: false
  command: ""

command-if-clean:
  enabled: false
  command: ""

timeout-ticks: 200
between-sign-ticks: 20
