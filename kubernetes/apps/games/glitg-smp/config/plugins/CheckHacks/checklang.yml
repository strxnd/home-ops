# GLITG uses hack checks only. Language checks remain available to trusted
# admins but never run automatically.
auto-check-on-join:
  enabled: false
  only-first-join: false

discord:
  enabled: false
  webhook-url: ""
  embed-color: 5763719
  message: "**Player:** &name&\n**Checked by:** &checker&\n**Language:** &lang&"

timeout-ticks: 100
