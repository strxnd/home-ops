# SMPGracePeriod configuration for GLITG SMP.
# Launch grace is started explicitly with /smpg start after the server launch
# window is opened. The plugin persists active/paused state on the data PVC.
grace-period:
  duration: 1h

messages:
  start: "<green>GLITG launch grace started. PvP is disabled for {time}.</green>"
  stop: "<red>GLITG launch grace ended. PvP is now enabled.</red>"
  pause: "<yellow>GLITG launch grace paused with {time} remaining.</yellow>"
  resume: "<green>GLITG launch grace resumed.</green>"
  status: "<blue>GLITG launch grace is {status}. Time remaining: {time}</blue>"
  milestone-title: "<yellow>GLITG launch grace</yellow>"
  milestone-subtitle: "<gold>{time} remaining</gold>"
  countdown-title: "<red>{time}</red>"
  countdown-subtitle: "<gray>until PvP is enabled</gray>"

bossbar:
  color: PURPLE
  style: SEGMENTED_20

sounds:
  milestone: "block.note_block.bell"
  countdown: "block.note_block.hat"
  final: "entity.player.levelup"
