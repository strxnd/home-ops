---
Config:
  update_notification: false
  data_save_time: 5
  retain_player_data_until_restart: true
  debug_actions: false
  experimental:
    variable_replacement: true
  item_meta_variable_enabled: true
  use_minimessage: false
  register_commands: []
  to_condition_groups: {}
Messages:
  prefix: "&8[&cGLITG&8] "
  commandReload: "&aConfig reloaded."
  commandNoPermissions: "&cYou do not have permission."
  eventEnableError: "&cUse /ce enable <event>."
  eventDisableError: "&cUse /ce disable <event>."
  eventEnabled: "&aEvent &7%event% &aenabled."
  eventDisabled: "&aEvent &7%event% &adisabled."
  eventIsNotEnabled: "&cThat event is not enabled."
  onlyPlayerCommand: "&cThis command can only be used by a player."
Events:
  lifesteal_week1_floor:
    type: custom
    enabled: true
    custom_event_data:
      event: com.zetaplugins.lifestealz.events.death.ZPlayerPvPDeathEvent
      player_variable: getEntity()
      variables_to_capture:
        - "%victim_max_health%;getEntity().getMaxHealth()"
    conditions:
      - "%victim_max_health% <= 6"
    actions:
      default:
        - "cancel_event: true"
  lifesteal_week2_floor:
    type: custom
    enabled: false
    custom_event_data:
      event: com.zetaplugins.lifestealz.events.death.ZPlayerPvPDeathEvent
      player_variable: getEntity()
      variables_to_capture:
        - "%victim_max_health%;getEntity().getMaxHealth()"
    conditions:
      - "%victim_max_health% <= 2"
    actions:
      default:
        - "cancel_event: true"
