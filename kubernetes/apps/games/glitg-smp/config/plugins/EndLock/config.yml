# EndLock Plugin Configuration
locked: true
language: en

update-checker:
  enabled: true
  notify-ops: true
  notify-chat: true

metrics:
  enabled: true

broadcast:
  enabled: true
  use-actionbar: true
  notify-all: true

logging:
  enabled: true
  log-file: "EndLock.log"
  log-attempts: true

test-command:
  enabled: true

stats:
  enabled: true
  lock-count: 0
  blocked-count: 0

join-notifications:
  enabled: false
  show-remaining: true

scheduled-unlock:
  enabled: false
  mode: "days"
  days: 7
  datetime: ""

hooks:
  mini-message: true
  placeholderapi: true
