# ============================================================
#  SpawnProtection — Main configuration
#  SpawnProtection — Configuración principal
#
#  Minimalist plugin to protect the spawn area.
#  Plugin minimalista para proteger el área de spawn.
#
#  No dependencies required. No unnecessary commands.
#  No requiere dependencias. No añade comandos innecesarios.
#
#  Keep this file simple for a clean, lightweight experience.
#  Mantén este archivo simple para una experiencia ligera y clara.
# ============================================================

config-version: 7

protection-area:
  # Protection mode used by the plugin.
  # Modo de protección usado por el plugin.
  #
  # radius = protects an area around the configured world spawn.
  # radius = protege un área alrededor del spawn del mundo configurado.
  #
  # world = protects the entire configured world.
  # world = protege todo el mundo configurado.
  #
  # Available options: radius, world
  # Opciones disponibles: radius, world
  mode: "radius"

spawn:
  # World whose spawn location will be protected.
  # Mundo cuya ubicación de spawn será protegida.
  world: "glitg-smp-26-2"

  # Protection radius around the configured world spawn.
  # Radio de protección alrededor del spawn del mundo configurado.
  #
  # Measured in blocks.
  # Se mide en bloques.
  radius: 15

  # Whether the Y axis should be included in radius checks.
  # Si se debe incluir el eje Y en las comprobaciones de radio.
  #
  # false = cylindrical protection, based only on X/Z distance.
  # false = protección cilíndrica, basada solo en distancia X/Z.
  #
  # true = spherical protection, including height difference.
  # true = protección esférica, incluyendo diferencia de altura.
  check-y-axis: false

  # Whether SpawnProtection should use a custom protection center.
  # Si SpawnProtection debe usar un centro de protección personalizado.
  #
  # false = uses the configured world's spawn location.
  # false = usa la ubicación de spawn del mundo configurado.
  #
  # true = uses the coordinates below as the protection center.
  # true = usa las coordenadas inferiores como centro de protección.
  use-custom-center: false

  # Custom protection center coordinates.
  # Coordenadas del centro de protección personalizado.
  #
  # These values are used only when use-custom-center is true.
  # Estos valores solo se usan cuando use-custom-center está en true.
  center:
    x: 0.5
    y: 64.0
    z: 0.5

protections:
  # Prevents players from breaking blocks inside the protected radius.
  # Evita que los jugadores rompan bloques dentro del radio protegido.
  block-break: true

  # Prevents players from placing blocks inside the protected radius.
  # Evita que los jugadores coloquen bloques dentro del radio protegido.
  block-place: true

  # Blocks PvP inside the protected radius.
  # Bloquea PvP dentro del radio protegido.
  pvp: true

  # Prevents explosions from destroying blocks inside the protected radius.
  # Evita que las explosiones destruyan bloques dentro del radio protegido.
  explosions: true

  # Blocks interactions with chests, doors, mechanisms, shulkers, etc.
  # Double chests are protected when either half touches the area. Entity-driven
  # physical triggers and redstone current changes inside the area are also blocked.
  # Bloquea interacciones con cofres, puertas, mecanismos, shulkers, etc.
  # Los cofres dobles quedan protegidos si cualquiera de sus mitades toca el área.
  # También se bloquean activaciones físicas y cambios de redstone dentro del área.
  interactions: true

  # Prevents fire from starting or burning blocks inside the protected area.
  # Evita que el fuego se inicie o queme bloques dentro del área protegida.
  fire: true

  # Blocks placing, taking and flowing water/lava inside the spawn area.
  # Bloquea colocar, recoger y fluir agua/lava dentro del área de spawn.
  fluids: true

  # Prevents pistons from moving blocks into, out of, or inside the protected area.
  # Evita que los pistones muevan bloques hacia dentro, fuera o dentro del área protegida.
  pistons: true

  # Protects decorative and passive entities from damage inside the spawn area.
  # Decorative entities cannot be manipulated, while normal use of villagers,
  # animals, boats and minecarts remains available. Protected storage and mount
  # inventories remain locked.
  # In world mode, this damage protection applies across the entire configured world.
  # Protege entidades decorativas y pasivas contra daños dentro del área de spawn.
  # Las entidades decorativas no se pueden manipular, mientras que el uso normal de
  # aldeanos, animales, barcos y vagonetas continúa disponible. Los inventarios de
  # almacenamiento y los inventarios de monturas protegidas permanecen bloqueados.
  # En modo world, esta protección contra daños se aplica a todo el mundo configurado.
  entities: true

  # Prevents hoppers and other inventories from moving items into or out of protected inventories.
  # Protected dispensers and droppers cannot eject items through redstone.
  # Evita que tolvas y otros inventarios muevan objetos hacia o desde inventarios protegidos.
  # Los dispensadores y soltadores protegidos no pueden expulsar objetos mediante redstone.
  inventory-transfer: true

  # Prevents natural state changes inside spawn, such as growth, decay, melting,
  # spreading and cauldron level changes.
  # Evita cambios naturales dentro del spawn, como crecimiento, caída de hojas,
  # deshielo, propagación y cambios de nivel de calderos.
  environment: true

settings:
  # Language used for plugin messages.
  # Idioma utilizado para los mensajes del plugin.
  #
  # Available options: en, es, fr, de, it, pt-br
  # Opciones disponibles: en, es, fr, de, it, pt-br
  language: "en"

  # Cooldown between repeated protection messages shown to the same player.
  # Set to 0 to disable message cooldown.
  # Tiempo de espera entre mensajes repetidos mostrados al mismo jugador.
  # Usa 0 para desactivar el cooldown de mensajes.
  message-cooldown-seconds: 1.5

