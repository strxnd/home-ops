---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app glitg-smp
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    timeout: 15m
    remediation:
      retries: 1
  interval: 1h
  maxHistory: 1
  upgrade:
    timeout: 15m
    remediation:
      retries: 1
  values:
    controllers:
      glitg-smp:
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 120
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        containers:
          app:
            image:
              repository: docker.io/itzg/minecraft-server
              tag: 2026.8.0-java25@sha256:e3335993929a1565f73c30b2041bcbc1473fc9c406fdd5a0d0ea24c08ef73320
            env:
              TZ: Asia/Singapore
              EULA: "TRUE"
              TYPE: PAPER
              VERSION: "26.2"
              PAPER_BUILD: "112"
              LEVEL: world
              SEED: "-3085124641489919468"
              MODE: survival
              FORCE_GAMEMODE: "false"
              DIFFICULTY: hard
              HARDCORE: "false"
              ALLOW_NETHER: "true"
              # SpawnProtection owns this behavior; avoid overlapping vanilla protection.
              SPAWN_PROTECTION: "0"
              SERVER_IP: ""
              SERVER_PORT: "25565"
              ENABLE_COMMAND_BLOCK: "false"
              MAX_PLAYERS: "10"
              OPS: Strxnd
              EXISTING_OPS_FILE: MERGE
              MEMORY: 6G
              VIEW_DISTANCE: "10"
              SIMULATION_DISTANCE: "8"
              # The image's internal startup command runner uses RCON. No RCON
              # port is exposed by this Service.
              ENABLE_RCON: "true"
              RCON_CMDS_STARTUP: |-
                worldborder set 4000
                gamerule locatorBar false
              PVP: "true"
              MOTD: GLITG SMP S1 - LifeSteal
              COPY_CONFIG_DEST: /data
              # Checked-in plugin files are authoritative and are synchronized
              # into the persistent data volume on every container start.
              SYNC_SKIP_NEWER_IN_DESTINATION: "false"
              APPLY_EXTRA_FILES: |-
                world/datapacks/DoubleBreezeRods</config/glitg-smp-doublebreezerods/pack.mcmeta
                world/datapacks/DoubleBreezeRods/data/doublebreezerods/loot_table/entities</config/glitg-smp-doublebreezerods/breeze.json
                world/datapacks/EightMinuteStrength</config/glitg-smp-eightminutestrength/pack.mcmeta
                world/datapacks/EightMinuteStrength/data/eightminutestrength/advancement</config/glitg-smp-eightminutestrength/consume_strong_strength.json
                world/datapacks/EightMinuteStrength/data/eightminutestrength/function</config/glitg-smp-eightminutestrength/extend_strength.mcfunction
              # Pinned upstream/artifact URLs; the official stock image downloads
              # and reconciles these into /data/plugins at container startup.
              # CoreProtect is built from PlayPro/CoreProtect@0bb1d5d with the
              # required 26.2 adapter and development branch metadata.
              PLUGINS: |-
                https://cdn.modrinth.com/data/l8Uv7FzS/versions/DqixaESV/lifestealz-2.21.1.jar
                https://cdn.modrinth.com/data/kV8iMq85/versions/yCPbvC8z/kaicore-1.5.jar
                https://cdn.modrinth.com/data/NiJ6gIEq/versions/lO8gD88d/ItemControl-1.2.0.jar
                https://cdn.modrinth.com/data/6owv5fWs/versions/v88A9PFQ/BukkitOfUtils-1.19.0.jar
                https://cdn.modrinth.com/data/NyGNHccT/versions/3gZerYe7/Pacifism-1.19.0.jar
                https://cdn.modrinth.com/data/dl7Te7dw/versions/20GgUcNT/SpawnProtection.jar
                https://cdn.modrinth.com/data/j2g3fqUV/versions/t8bMoUaC/cartlimiter-1.7.jar
                https://cdn.modrinth.com/data/LJNGWSvH/versions/Cflesrfj/grimac-bukkit-2.3.74-0a18c77.jar
                https://raw.githubusercontent.com/strxnd/home-ops/fac3475c361a42d26b7c67251ee5806e177a014d/kubernetes/apps/games/glitg-smp/app/artifacts/CoreProtect-24.0-26.2-0bb1d5d.jar
                https://cdn.modrinth.com/data/bYazc7fd/versions/cAOIkpWF/InvSee%2B%2B.jar
                https://cdn.modrinth.com/data/nFLmET4i/versions/7a1fv1Yn/SlashString-1.1.0-mc26.2.jar
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 25565
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 90
            resources:
              requests:
                cpu: 2000m
                memory: 7Gi
              limits:
                cpu: 4000m
                memory: 8Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "192.168.20.12"
        externalTrafficPolicy: Local
        ports:
          minecraft:
            port: *port
            protocol: TCP
    persistence:
      data:
        type: persistentVolumeClaim
        suffix: 26-2
        accessMode: ReadWriteOnce
        size: 20Gi
        storageClass: local-path
        retain: true
        globalMounts:
          - path: /data
      spawn-protection:
        type: configMap
        name: glitg-smp-spawn-protection
        globalMounts:
          - path: /config/plugins/SpawnProtection
      lifestealz:
        type: configMap
        name: glitg-smp-lifestealz
        globalMounts:
          - path: /config/plugins/LifeStealZ
      kaicore:
        type: configMap
        name: glitg-smp-kaicore
        globalMounts:
          - path: /config/plugins/KaiCore
      pacifism:
        type: configMap
        name: glitg-smp-pacifism
        globalMounts:
          - path: /config/plugins/Pacifism
      cartlimiter:
        type: configMap
        name: glitg-smp-cartlimiter
        globalMounts:
          - path: /config/plugins/CartLimiter
      slashstring:
        type: configMap
        name: glitg-smp-slashstring
        globalMounts:
          - path: /config/plugins/SlashString
      itemcontrol:
        type: configMap
        name: glitg-smp-itemcontrol
        globalMounts:
          - path: /config/plugins/ItemControl
      coreprotect:
        type: configMap
        name: glitg-smp-coreprotect
        globalMounts:
          - path: /config/plugins/CoreProtect
      grim:
        type: configMap
        name: glitg-smp-grim
        globalMounts:
          - path: /config/plugins/GrimAC
      invsee:
        type: configMap
        name: glitg-smp-invsee
        globalMounts:
          - path: /config/plugins/InvSeePlusPlus
      bukkitofutils:
        type: configMap
        name: glitg-smp-bukkitofutils
        globalMounts:
          - path: /config/plugins/BukkitOfUtils
      doublebreezerods-datapack:
        type: configMap
        name: glitg-smp-doublebreezerods
        globalMounts:
          - path: /config/glitg-smp-doublebreezerods
      eightminutestrength-datapack:
        type: configMap
        name: glitg-smp-eightminutestrength
        globalMounts:
          - path: /config/glitg-smp-eightminutestrength
