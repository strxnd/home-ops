---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app glitg-smp
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    timeout: 15m
    remediation:
      retries: 1
  interval: 1h
  maxHistory: 1
  upgrade:
    timeout: 15m
    remediation:
      retries: 1
  values:
    controllers:
      glitg-smp:
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 120
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        containers:
          app:
            image:
              repository: docker.io/itzg/minecraft-server
              tag: 2026.8.0-java21@sha256:b76b9298a2a60d5cf9d223e009cd0b8ad620c2080abd83f9a1fa5084fa87f9ab
            env:
              TZ: Asia/Singapore
              EULA: "TRUE"
              TYPE: PAPER
              VERSION: "1.21.11"
              PAPER_BUILD: "132"
              LEVEL: glitg-smp
              SEED: "-3085124641489919468"
              MODE: survival
              DIFFICULTY: hard
              HARDCORE: "false"
              MAX_PLAYERS: "10"
              OPS: Strxnd
              EXISTING_OPS_FILE: MERGE
              MEMORY: 6G
              VIEW_DISTANCE: "10"
              SIMULATION_DISTANCE: "8"
              ENABLE_RCON: "false"
              MOTD: "GLITG S1 - LifeSteal"
              COPY_CONFIG_DEST: /data
              # Image-managed rule config is authoritative for this fresh season.
              SYNC_SKIP_NEWER_IN_DESTINATION: "false"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 25565
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 90
            resources:
              requests:
                cpu: 2000m
                memory: 7Gi
              limits:
                cpu: 4000m
                memory: 8Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: "glitg.${SECRET_DOMAIN}"
          lbipam.cilium.io/ips: "192.168.20.12"
        externalTrafficPolicy: Cluster
        ports:
          minecraft:
            port: *port
            protocol: TCP
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 20Gi
        storageClass: local-path
        globalMounts:
          - path: /data
      paper-world-defaults:
        type: configMap
        name: glitg-smp-paper-world-defaults
        globalMounts: [{path: /config/config}]
      datapack:
        type: configMap
        name: glitg-smp-datapack
        globalMounts: [{path: /config/glitg-smp/datapacks/SMPChanges}]
      datapack-loot:
        type: configMap
        name: glitg-smp-datapack-loot
        globalMounts: [{path: /config/glitg-smp/datapacks/SMPChanges/data/minecraft/loot_table/entities}]
      cart-limiter:
        type: configMap
        name: glitg-smp-cart-limiter
        globalMounts: [{path: /config/plugins/CartLimiter}]
      conditional-events:
        type: configMap
        name: glitg-smp-conditional-events
        globalMounts: [{path: /config/plugins/ConditionalEvents}]
      denizen:
        type: configMap
        name: glitg-smp-denizen
        globalMounts: [{path: /config/plugins/Denizen}]
      denizen-scripts:
        type: configMap
        name: glitg-smp-denizen-scripts
        globalMounts: [{path: /config/plugins/Denizen/scripts}]
      disable-riptide:
        type: configMap
        name: glitg-smp-disable-riptide
        globalMounts: [{path: /config/plugins/DisableRiptide}]
      epic-safe-pvp:
        type: configMap
        name: glitg-smp-epic-safe-pvp
        globalMounts: [{path: /config/plugins/EpicSafePvp}]
      force-xaero-fair-play:
        type: configMap
        name: glitg-smp-force-xaero-fair-play
        globalMounts: [{path: /config/plugins/ForceXaeroFairPlay}]
      item-blocker:
        type: configMap
        name: glitg-smp-item-blocker
        globalMounts: [{path: /config/plugins/ItemBlocker}]
      item-limiter:
        type: configMap
        name: glitg-smp-item-limiter
        globalMounts: [{path: /config/plugins/ItemLimiter}]
      life-steal-z:
        type: configMap
        name: glitg-smp-life-steal-z
        globalMounts: [{path: /config/plugins/LifeStealZ}]
