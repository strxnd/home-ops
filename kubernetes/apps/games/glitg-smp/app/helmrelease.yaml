---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app glitg-smp
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    timeout: 15m
    remediation:
      retries: 1
  interval: 1h
  maxHistory: 1
  upgrade:
    timeout: 15m
    remediation:
      retries: 1
  values:
    controllers:
      glitg-smp:
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 120
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        containers:
          app:
            image:
              repository: docker.io/itzg/minecraft-server
              tag: 2026.8.0-java21@sha256:b76b9298a2a60d5cf9d223e009cd0b8ad620c2080abd83f9a1fa5084fa87f9ab
            env:
              TZ: Asia/Singapore
              EULA: "TRUE"
              TYPE: PAPER
              VERSION: "1.21.11"
              PAPER_BUILD: "132"
              LEVEL: glitg-smp
              SEED: "-3085124641489919468"
              MODE: survival
              FORCE_GAMEMODE: "false"
              DIFFICULTY: hard
              HARDCORE: "false"
              ALLOW_NETHER: "true"
              SPAWN_PROTECTION: "0"
              SERVER_IP: ""
              SERVER_PORT: &port 25565
              ENABLE_COMMAND_BLOCK: "false"
              MAX_PLAYERS: "10"
              OPS: Strxnd
              EXISTING_OPS_FILE: MERGE
              MEMORY: 6G
              VIEW_DISTANCE: "10"
              SIMULATION_DISTANCE: "8"
              ENABLE_RCON: "false"
              MOTD: "GLITG S1 - LifeSteal"
              PVP: "true"
              PLUGINS: |-
                https://github.com/ZetaPlugins/LifeStealZ/releases/download/2.21.1/lifestealz-2.21.1.jar
                https://cdn.modrinth.com/data/llBXN1az/versions/UDmXINBt/SMPGracePeriod-1.0.jar
                https://cdn.modrinth.com/data/kV8iMq85/versions/yCPbvC8z/kaicore-1.5.jar
                https://cdn.modrinth.com/data/1Ffl2uIq/versions/OhJOp27l/PvPManager.jar
                https://cdn.modrinth.com/data/oU6KywXa/versions/I1Q42DEU/LongerPotionsLevels1.0.1.jar
                https://cdn.modrinth.com/data/x882y0hP/versions/tnIRjZj2/MaceDamageCap-1.0.2.jar
                https://cdn.modrinth.com/data/NiJ6gIEq/versions/lO8gD88d/ItemControl-1.2.0.jar
                https://cdn.modrinth.com/data/4oi6UbJ7/versions/q0badV96/the-limiters-1.0.0.jar
                https://cdn.modrinth.com/data/j2g3fqUV/versions/t8bMoUaC/cartlimiter-1.7.jar
                https://cdn.modrinth.com/data/Lu3KuzdV/versions/Kma0kBsY/CoreProtect-CE-24.0.jar
                https://cdn.modrinth.com/data/LJNGWSvH/versions/fbt7nJt5/grimac-bukkit-2.3.74-2614909.jar
                https://cdn.modrinth.com/data/P1OZGk5p/versions/N1tHqKId/ViaVersion-5.12.0-SNAPSHOT.jar
                https://cdn.modrinth.com/data/fALzjamp/versions/P3y2MXnd/Chunky-Bukkit-1.4.40.jar
              REMOVE_OLD_MODS: "TRUE"
              REMOVE_OLD_MODS_INCLUDE: "*.jar"
              REMOVE_OLD_MODS_DEPTH: "1"
              COPY_CONFIG_DEST: /data
              # Image-managed rule config is authoritative for this fresh season.
              SYNC_SKIP_NEWER_IN_DESTINATION: "false"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 25565
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 90
            resources:
              requests:
                cpu: 2000m
                memory: 7Gi
              limits:
                cpu: 4000m
                memory: 8Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
      acceptance-checklist:
        strategy: RollingUpdate
        pod:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        containers:
          app:
            image:
              repository: docker.io/nginxinc/nginx-unprivileged
              tag: 1.27.5-alpine@sha256:28d91bdce70ad09025ea901458fdd149259d8e05982ade79d4ef2c0d9470eb48
            env:
              CHECKLIST_VERSION: "server-test-checklist-v1"
            probes:
              liveness: &checklistProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &checklistPort 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *checklistProbe
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "192.168.20.12"
        externalTrafficPolicy: Local
        ports:
          minecraft:
            port: *port
            protocol: TCP
      acceptance-checklist:
        controller: acceptance-checklist
        ports:
          http:
            port: *checklistPort
    route:
      acceptance-checklist:
        hostnames: ["glitg-checklist.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: acceptance-checklist
                port: *checklistPort
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 20Gi
        storageClass: local-path
        globalMounts:
          - path: /data
      paper-world-defaults:
        type: configMap
        name: glitg-smp-paper-world-defaults
        globalMounts: [{path: /config/config}]
      datapack:
        type: configMap
        name: glitg-smp-datapack
        globalMounts: [{path: /config/glitg-smp/datapacks/SMPChanges}]
      datapack-loot:
        type: configMap
        name: glitg-smp-datapack-loot
        globalMounts: [{path: /config/glitg-smp/datapacks/SMPChanges/data/minecraft/loot_table/entities}]
      datapack-load:
        type: configMap
        name: glitg-smp-datapack-load
        globalMounts: [{path: /config/glitg-smp/datapacks/SMPChanges/data/minecraft/tags/function}]
      datapack-functions:
        type: configMap
        name: glitg-smp-datapack-functions
        globalMounts: [{path: /config/glitg-smp/datapacks/SMPChanges/data/glitg/function}]
      datapack-recipes:
        type: configMap
        name: glitg-smp-datapack-recipes
        globalMounts: [{path: /config/glitg-smp/datapacks/SMPChanges/data/minecraft/recipe}]
      cart-limiter:
        type: configMap
        name: glitg-smp-cart-limiter
        globalMounts: [{path: /config/plugins/CartLimiter}]
      kai-core:
        type: configMap
        name: glitg-smp-kai-core
        globalMounts: [{path: /config/plugins/KaiCore}]
      pvp-manager:
        type: configMap
        name: glitg-smp-pvp-manager
        globalMounts: [{path: /config/plugins/PvPManager}]
      mace-damage-cap:
        type: configMap
        name: glitg-smp-mace-damage-cap
        globalMounts: [{path: /config/plugins/MaceDamageCap}]
      longer-potion-levels:
        type: configMap
        name: glitg-smp-longer-potion-levels
        globalMounts: [{path: /config/plugins/LongerPotionLevels}]
      item-control:
        type: configMap
        name: glitg-smp-item-control
        globalMounts: [{path: /config/plugins/ItemControl}]
      the-limiters:
        type: configMap
        name: glitg-smp-the-limiters
        globalMounts: [{path: /config/plugins/TheLimiters}]
      life-steal-z:
        type: configMap
        name: glitg-smp-life-steal-z
        globalMounts: [{path: /config/plugins/LifeStealZ}]
      smp-grace-period:
        type: configMap
        name: glitg-smp-smp-grace-period
        globalMounts: [{path: /config/plugins/SMPGracePeriod}]
      acceptance-checklist:
        type: configMap
        name: glitg-smp-acceptance-checklist
        advancedMounts:
          acceptance-checklist:
            app:
              - path: /usr/share/nginx/html/index.html
                subPath: index.html
      acceptance-checklist-tmp:
        type: emptyDir
        advancedMounts:
          acceptance-checklist:
            app:
              - path: /tmp
