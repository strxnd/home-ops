---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: glitg-smp
spec:
  endpoints:
    - dnsName: "glitg.${SECRET_DOMAIN}"
      recordType: A
      targets:
        - "${SECRET_PUBLIC_IP}"
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "false"
