---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./app/dnsendpoint.yaml
  - ./app/helmrelease.yaml
  - ./app/ocirepository.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: glitg-smp-paper-world-defaults
    files:
      - paper-world-defaults.yml=config/config/paper-world-defaults.yml
  - name: glitg-smp-datapack
    files:
      - pack.mcmeta=config/glitg-smp/datapacks/SMPChanges/pack.mcmeta
  - name: glitg-smp-datapack-loot
    files:
      - breeze.json=config/glitg-smp/datapacks/SMPChanges/data/minecraft/loot_table/entities/breeze.json
  - name: glitg-smp-cart-limiter
    files: [config/plugins/CartLimiter/config.yml]
  - name: glitg-smp-conditional-events
    files: [config/plugins/ConditionalEvents/config.yml]
  - name: glitg-smp-denizen
    files: [config/plugins/Denizen/config.yml]
  - name: glitg-smp-denizen-scripts
    files: [config/plugins/Denizen/scripts/glitg.dsc]
  - name: glitg-smp-disable-riptide
    files: [config/plugins/DisableRiptide/config.yml]
  - name: glitg-smp-epic-safe-pvp
    files: [config/plugins/EpicSafePvp/config.yml]
  - name: glitg-smp-force-xaero-fair-play
    files: [config/plugins/ForceXaeroFairPlay/config.yml]
  - name: glitg-smp-item-blocker
    files:
      - config/plugins/ItemBlocker/config.yml
      - config/plugins/ItemBlocker/blocked-items.yml
  - name: glitg-smp-item-limiter
    files:
      - config/plugins/ItemLimiter/config.yml
      - config/plugins/ItemLimiter/items.yml
  - name: glitg-smp-life-steal-z
    files:
      - config/plugins/LifeStealZ/config.yml
      - config/plugins/LifeStealZ/items.yml
