---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app vexbot-lab
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    timeout: 15m
    remediation:
      retries: 1
  interval: 1h
  maxHistory: 1
  upgrade:
    timeout: 15m
    remediation:
      retries: 1
  values:
    controllers:
      vexbot-lab:
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 120
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        initContainers:
          check-world:
            image:
              repository: docker.io/itzg/minecraft-server
              tag: 2026.8.0-java25@sha256:e3335993929a1565f73c30b2041bcbc1473fc9c406fdd5a0d0ea24c08ef73320
            command:
              - /bin/sh
              - -ec
            args:
              - test -f /data/world/level.dat || { echo 'Import the world to /data/world before starting the server'; exit 1; }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: docker.io/itzg/minecraft-server
              tag: 2026.8.0-java25@sha256:e3335993929a1565f73c30b2041bcbc1473fc9c406fdd5a0d0ea24c08ef73320
            env:
              TZ: Asia/Singapore
              EULA: "TRUE"
              TYPE: FABRIC
              VERSION: "26.2"
              FABRIC_LOADER_VERSION: "0.19.5"
              LEVEL: world
              MODE: survival
              FORCE_GAMEMODE: "false"
              DIFFICULTY: hard
              HARDCORE: "false"
              ALLOW_NETHER: "true"
              SPAWN_PROTECTION: "0"
              SERVER_IP: ""
              SERVER_PORT: "25565"
              ENABLE_COMMAND_BLOCK: "false"
              MAX_PLAYERS: "40"
              OPS: Strxnd
              ENABLE_WHITELIST: "true"
              ENFORCE_WHITELIST: "true"
              WHITELIST: Strxnd
              MEMORY: 12G
              VIEW_DISTANCE: "8"
              SIMULATION_DISTANCE: "8"
              # The image's internal startup command runner uses RCON. No RCON
              # port is exposed by this Service.
              ENABLE_RCON: "true"
              PVP: "true"
              MOTD: avyaan and lillie 2.0
              MODRINTH_DOWNLOAD_DEPENDENCIES: required
              MODRINTH_PROJECTS: |-
                fabric-api:ewUK83HI
                fabric-language-kotlin:eRRZzGMc
                carpet:bGrLxJ8v
                carpet-extra:Z5BJRYil
                carpet-tis-addition:lW1s6HL1
                lithium:f7vZ0VWU
                ferrite-core:d5ddUdiB
                krypton:5WeL0Nkz
                spark:e3hsPc1o
                syncmatica:POv0nHxV
                servux:cjAxEbhD
                no-chat-reports:aDbxaVTi
                luckperms:DzQPkkXY
                vanilla-permissions:bpq3ZDRl
                elytra-trims:6vl1Qyl0
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 25565
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 90
            resources:
              requests:
                cpu: 4000m
                memory: 14Gi
              limits:
                cpu: 8000m
                memory: 16Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "192.168.20.13"
        externalTrafficPolicy: Local
        ports:
          minecraft:
            port: *port
            protocol: TCP
    persistence:
      data:
        type: persistentVolumeClaim
        suffix: avyaan-26-2
        accessMode: ReadWriteOnce
        size: 20Gi
        storageClass: local-path
        retain: true
        globalMounts:
          - path: /data
