---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test
  labels:
    app.kubernetes.io/name: test
spec:
  replicas: 1
  # Keep the same agent identity across restarts so the playit.gg claim
  # survives pod recreation.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: claim
          image: ghcr.io/playit-cloud/playit-agent:0.17.1
          # Prints a claim URL, waits (up to 1h) for it to be claimed in the
          # browser, then writes the agent secret to the shared volume. On
          # timeout the init fails and a fresh claim is generated on retry.
          command: ["/bin/sh", "-ec"]
          args:
            - |-
              CODE=$(/usr/local/bin/playit claim generate)
              echo "CLAIM URL: $(/usr/local/bin/playit claim url --name test "$CODE")"
              SECRET=$(/usr/local/bin/playit claim exchange --wait 3600 "$CODE")
              printf '%s' "$SECRET" > /etc/playit/secret.key
              echo "claim exchanged, secret written"
          volumeMounts:
            - name: config
              mountPath: /etc/playit
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: playit
          image: ghcr.io/playit-cloud/playit-agent:0.17.1
          command: ["/usr/local/bin/playit"]
          args:
            - --secret_path
            - /etc/playit/secret.key
            - start
            - -s
          volumeMounts:
            - name: config
              mountPath: /etc/playit
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          emptyDir: {}
