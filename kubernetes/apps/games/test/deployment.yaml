---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test
  labels:
    app.kubernetes.io/name: test
spec:
  replicas: 1
  # Keep the same agent identity across restarts so the playit.gg claim
  # survives pod recreation.
  strategy: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: playit
          image: ghcr.io/playit-cloud/playit-agent:0.17.1
          # On first start (empty config) the agent prints a claim URL to the
          # logs; visit it to bind this agent to a playit.gg account and set
          # up tunnels. Config is persisted to the emptyDir volume.
          volumeMounts:
            - name: config
              mountPath: /etc/playit
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          emptyDir: {}
