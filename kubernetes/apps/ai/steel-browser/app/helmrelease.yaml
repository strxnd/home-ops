---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app steel-browser
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    timeout: 10m
    remediation:
      retries: 1
  upgrade:
    timeout: 10m
    remediation:
      retries: 1
  values:
    controllers:
      steel-browser:
        pod:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            seccompProfile: { type: RuntimeDefault }
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/steel-dev/steel-browser
              tag: latest@sha256:1c988dc8a8eda687648d1c94e10e8b8627343977119f09aa34a6adf345ba104d
            command:
              - /bin/sh
              - -ec
            args:
              - |
                rm -f /tmp/.X10-lock /tmp/.X11-unix/X10
                mkdir -p /tmp/.X11-unix
                Xvfb :10 -screen 0 1920x1080x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
                unset DBUS_SESSION_BUS_ADDRESS
                exec /app/api/entrypoint.sh
            env:
              NODE_ENV: production
              HOST: 0.0.0.0
              PORT: "3000"
              DOMAIN: steel.${SECRET_DOMAIN}
              CDP_DOMAIN: steel-cdp.${SECRET_DOMAIN}
              USE_SSL: "true"
              CHROME_HEADLESS: "false"
              CHROME_ARGS: --dbus-stub
              FILTER_CHROME_ARGS: --no-first-run
              DISABLE_CHROME_SANDBOX: "true"
              LOG_STORAGE_ENABLED: "true"
              LOG_STORAGE_PATH: /data/logs/browser-logs.duckdb
              DEBUG: "true"
              TZ: Asia/Singapore
              DEFAULT_TIMEZONE: Asia/Singapore
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/health
                    port: 3000
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/health
                    port: 3000
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                cpu: 4000m
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - SETGID
                  - SETUID
                  - SYS_PTRACE
                  - SYS_RESOURCE
    service:
      main:
        controller: *app
        ports:
          http:
            port: 3000
          cdp:
            port: &cdpPort 9223
    route:
      main:
        hostnames:
          - steel.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: 3000
      cdp:
        hostnames:
          - steel-cdp.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: *cdpPort
    persistence:
      logs:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: local-path
        globalMounts:
          - path: /data/logs
      cache:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: local-path
        globalMounts:
          - path: /app/.cache
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      nginx-logs:
        type: emptyDir
        globalMounts:
          - path: /var/log/nginx
      dbus-run:
        type: emptyDir
        globalMounts:
          - path: /run/dbus
