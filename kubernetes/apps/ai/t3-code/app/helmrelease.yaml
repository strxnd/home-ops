---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.8.3/helmrelease_v2.json?values=app-template/4.6.2
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app t3-code
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    timeout: 5m
    remediation:
      retries: 1
  upgrade:
    timeout: 5m
    remediation:
      retries: 1
  values:
    controllers:
      t3-code:
        pod:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: &uid 1000
            runAsGroup: *uid
            fsGroup: *uid
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        strategy: Recreate
        initContainers:
          01-prepare-home:
            image:
              repository: ghcr.io/strxnd/t3-code-server
              tag: t3-0.0.29-nightly.20260709.769-node-24.18.0-codex-0.144.1-claude-2.1.206-opencode-1.17.18-gh-2.96.0-sshd@sha256:7c2717566e235281583d8e73ed63b7e085f5b4ef4ccdfb959cf9efd4c2b3bbee
            command:
              - /bin/bash
              - -ec
            args:
              - |
                mkdir -p \
                  /data/t3 \
                  /home/t3/.cache \
                  /home/t3/.claude \
                  /home/t3/.codex \
                  /home/t3/.config \
                  /home/t3/.local/bin \
                  /home/t3/.local/share \
                  /home/t3/.ssh \
                  /workspace
                chown 1000:1000 /home/t3
                chmod 755 /home/t3
                chmod 700 /home/t3/.ssh
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
          02-install-nix:
            image:
              repository: ghcr.io/strxnd/t3-code-server
              tag: t3-0.0.29-nightly.20260709.769-node-24.18.0-codex-0.144.1-claude-2.1.206-opencode-1.17.18-gh-2.96.0-sshd@sha256:7c2717566e235281583d8e73ed63b7e085f5b4ef4ccdfb959cf9efd4c2b3bbee
            command:
              - /bin/bash
              - -ec
            args:
              - |
                if [[ ! -x /home/t3/.nix-profile/bin/nix ]]; then
                  apt-get update
                  apt-get install --yes --no-install-recommends xz-utils
                  rm -rf /var/lib/apt/lists/*
                  curl \
                    --proto '=https' \
                    --tlsv1.2 \
                    --fail \
                    --location \
                    --output /tmp/install-nix \
                    https://releases.nixos.org/nix/nix-2.34.7/install
                  chown 1000:1000 /nix
                  su --shell /bin/sh t3 --command \
                    'sh /tmp/install-nix --no-daemon --yes --no-channel-add --no-modify-profile'
                fi
            env:
              HOME: /home/t3
              USER: t3
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
        containers:
          main:
            image:
              repository: ghcr.io/strxnd/t3-code-server
              tag: t3-0.0.29-nightly.20260709.769-node-24.18.0-codex-0.144.1-claude-2.1.206-opencode-1.17.18-gh-2.96.0-sshd@sha256:7c2717566e235281583d8e73ed63b7e085f5b4ef4ccdfb959cf9efd4c2b3bbee
            env:
              TZ: Asia/Kolkata
              HOME: /home/t3
              USER: t3
              PATH: /home/t3/.nix-profile/bin:/home/t3/.local/bin:/usr/local/bin:/usr/bin:/bin
              NIX_CONFIG: experimental-features = nix-command flakes
              T3CODE_HOME: /data/t3
              T3CODE_HOST: 0.0.0.0
              T3CODE_PORT: "3773"
              T3CODE_NO_BROWSER: "true"
              CODEX_HOME: /home/t3/.codex
              STEEL_BROWSER_API_URL: https://steel.${SECRET_DOMAIN}/v1
              STEEL_API_KEY: self-hosted
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 3773
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 2000m
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
          sshd:
            image:
              repository: ghcr.io/strxnd/t3-code-server
              tag: t3-0.0.29-nightly.20260709.769-node-24.18.0-codex-0.144.1-claude-2.1.206-opencode-1.17.18-gh-2.96.0-sshd@sha256:7c2717566e235281583d8e73ed63b7e085f5b4ef4ccdfb959cf9efd4c2b3bbee
            command:
              - /usr/local/bin/t3-sshd
            env:
              T3CODE_SSH_PORT: "2222"
            probes:
              liveness: &sshProbes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &sshPort 2222
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *sshProbes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *sshPort
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 12
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              capabilities:
                drop:
                  - ALL
                add:
                  - AUDIT_WRITE
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - KILL
                  - SETGID
                  - SETUID
                  - SYS_CHROOT
    service:
      main:
        controller: *app
        ports:
          http:
            port: *port
      ssh:
        controller: *app
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: t3-code-ssh.${SECRET_DOMAIN}
          lbipam.cilium.io/ips: "192.168.20.14"
        externalTrafficPolicy: Cluster
        ports:
          ssh:
            port: 22
            targetPort: *sshPort
            protocol: TCP
    route:
      main:
        hostnames:
          - t3-code.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: main
                port: *port
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 20Gi
        storageClass: local-path
        globalMounts:
          - path: /data
      home:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: local-path
        globalMounts:
          - path: /home/t3
      nix:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 20Gi
        storageClass: local-path
        globalMounts:
          - path: /nix
      workspace:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 50Gi
        storageClass: local-path
        globalMounts:
          - path: /workspace
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
