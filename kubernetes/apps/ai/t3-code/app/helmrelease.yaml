---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.8.3/helmrelease_v2.json?values=app-template/4.6.2
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app t3-code
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    timeout: 5m
    remediation:
      retries: 1
  upgrade:
    timeout: 5m
    remediation:
      retries: 1
  values:
    controllers:
      t3-code:
        pod:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: &uid 1000
            runAsGroup: *uid
            fsGroup: *uid
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        strategy: Recreate
        initContainers:
          prepare-home:
            image:
              repository: ghcr.io/strxnd/t3-code-server
              tag: t3-0.0.28-node-24.18.0@sha256:412203b08c7ff75df320f53f3da7097a1512a40b4e538668fe6dc07efa485944
            command:
              - /bin/bash
              - -ec
            args:
              - |
                mkdir -p \
                  /data/t3 \
                  /home/t3/.cache \
                  /home/t3/.claude \
                  /home/t3/.codex \
                  /home/t3/.config \
                  /home/t3/.local/bin \
                  /home/t3/.local/share \
                  /home/t3/.ssh \
                  /workspace
                chmod 700 /home/t3/.ssh
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        containers:
          main:
            image:
              repository: ghcr.io/strxnd/t3-code-server
              tag: t3-0.0.28-node-24.18.0@sha256:412203b08c7ff75df320f53f3da7097a1512a40b4e538668fe6dc07efa485944
            env:
              TZ: Asia/Kolkata
              HOME: /home/t3
              T3CODE_HOME: /data/t3
              T3CODE_HOST: 0.0.0.0
              T3CODE_PORT: "3773"
              T3CODE_NO_BROWSER: "true"
              CODEX_HOME: /home/t3/.codex
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 3773
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 2000m
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
    service:
      main:
        controller: *app
        ports:
          http:
            port: *port
    route:
      main:
        hostnames:
          - t3-code.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: main
                port: *port
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 20Gi
        storageClass: local-path
        globalMounts:
          - path: /data
      home:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: local-path
        globalMounts:
          - path: /home/t3
      workspace:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 50Gi
        storageClass: local-path
        globalMounts:
          - path: /workspace
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
