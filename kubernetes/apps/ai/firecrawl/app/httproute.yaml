---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: firecrawl
  annotations:
    gatus.home-operations.com/endpoint: |-
      conditions:
        - "[STATUS] == 200"
spec:
  hostnames: ["firecrawl.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: firecrawl-api
          port: 3002
      matches:
        - path:
            type: PathPrefix
            value: /
