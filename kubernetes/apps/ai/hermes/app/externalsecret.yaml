---
# The internal-only Webapp uses Hermes's documented username/password provider.
# Generate independent credentials once; no credential values are stored in Git.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: hermes-auth
spec:
  length: 48
  digits: 12
  symbols: 0
  allowRepeat: true
  secretKeys:
    - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
    - HERMES_DASHBOARD_BASIC_AUTH_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-auth
spec:
  refreshPolicy: CreatedOnce
  target:
    name: hermes-auth
    creationPolicy: Orphan
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: hermes-auth
