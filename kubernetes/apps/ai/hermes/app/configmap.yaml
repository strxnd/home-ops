---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/config-map_v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config-seed
data:
  config.yaml: |
    providers:
      sparks:
        api: http://192.168.20.21:8888/v1
        transport: chat_completions
        extra_body:
          chat_template_kwargs:
            enable_thinking: false
    model:
      provider: custom:sparks
      default: GLM-5.3-Flash-EXL3
    tool_loop_guardrails:
      warnings_enabled: true
      hard_stop_enabled: true
      hard_stop_after:
        exact_failure: 5
        same_tool_failure: 8
        idempotent_no_progress: 5
    terminal:
      backend: local
      timeout: 180
      home_mode: auto
    dashboard:
      public_url: https://hermes.${SECRET_DOMAIN}
      trusted_proxies:
        - 10.0.0.0/8
