---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: omarchy
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omarchy
    spec:
      domain:
        cpu:
          cores: 8
        resources:
          requests:
            memory: 16Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - port: 5901
                  protocol: TCP
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 60
      volumes:
        - name: rootdisk
          persistentVolumeClaim:
            claimName: cua-desktop-rootdisk
