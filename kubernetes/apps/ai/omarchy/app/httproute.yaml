---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omarchy
  annotations:
    gatus.home-operations.com/endpoint: |-
      conditions:
        - "[STATUS] == 200"
spec:
  hostnames: ["omarchy.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: omarchy-novnc
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /
