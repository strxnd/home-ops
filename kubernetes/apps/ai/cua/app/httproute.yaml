---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.35.2-standalone-strict/httproute-gateway.networking.k8s.io-v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cua
  annotations:
    gatus.home-operations.com/endpoint: |-
      conditions:
        - "[STATUS] == 200"
spec:
  hostnames: ["cua.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: cua-novnc
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /
