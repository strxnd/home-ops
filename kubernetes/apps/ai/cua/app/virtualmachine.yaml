---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.35.2-standalone-strict/_definitions.json
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: cua-desktop
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cua
    spec:
      domain:
        cpu:
          cores: 4
        resources:
          requests:
            memory: 8Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - port: 8000
                  protocol: TCP
                - port: 3000
                  protocol: TCP
                - port: 5900
                  protocol: TCP
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 60
  volumes:
    - name: rootdisk
      containerDisk:
        image: public.ecr.aws/k5j5w0x5/cua-omarchy-workspace@sha256:bc3895e1539ff1c108bf6cfc6c5bc4ac4d2e44d2f214d646956b4d7185f00ee2
