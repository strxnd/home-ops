---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.35.2-standalone-strict/_definitions.json
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: cua-desktop
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cua
    spec:
      domain:
        cpu:
          cores: 4
        resources:
          requests:
            memory: 8Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - port: 8000
                  protocol: TCP
                - port: 3000
                  protocol: TCP
                - port: 5901
                  protocol: TCP
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 60
      volumes:
        - name: rootdisk
          persistentVolumeClaim:
            claimName: cua-desktop-rootdisk
