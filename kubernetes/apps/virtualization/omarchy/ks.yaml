---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: omarchy
spec:
  dependsOn:
    - name: cdi
      namespace: virtualization
    - name: kubevirt
      namespace: virtualization
    - name: local-path-provisioner
      namespace: kube-system
    - name: envoy-gateway
      namespace: network
  interval: 1h
  path: ./kubernetes/apps/virtualization/omarchy/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: virtualization
  timeout: 30m
  wait: false
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: omarchy-console
      namespace: virtualization
    - apiVersion: kubevirt.io/v1
      kind: VirtualMachine
      name: omarchy
      namespace: virtualization
  healthCheckExprs:
    - apiVersion: kubevirt.io/v1
      kind: VirtualMachine
      current: >-
        has(status.conditions) &&
        status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
