---
apiVersion: v1
kind: Service
metadata:
  name: omarchy-ssh
  annotations:
    lbipam.cilium.io/ips: "192.168.20.14"
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  selector:
    kubevirt.io/domain: omarchy
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
