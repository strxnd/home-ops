---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omarchy-console
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: omarchy-console
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      ports:
        - protocol: TCP
          port: 6080
