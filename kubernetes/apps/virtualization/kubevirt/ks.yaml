---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubevirt
spec:
  dependsOn:
    - name: local-path-provisioner
      namespace: kube-system
  interval: 1h
  path: ./kubernetes/apps/virtualization/kubevirt/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 15m
  healthChecks:
    - apiVersion: kubevirt.io/v1
      kind: KubeVirt
      name: kubevirt
      namespace: kubevirt
  healthCheckExprs:
    - apiVersion: kubevirt.io/v1
      kind: KubeVirt
      current: >-
        has(status) && has(status.conditions) &&
        status.conditions.exists(c, c.type == 'Available' && c.status == 'True')
