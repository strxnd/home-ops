---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: portainer
spec:
  interval: 1h
  maxHistory: 1
  chart:
    spec:
      chart: portainer
      version: 239.4.0
      sourceRef:
        kind: HelmRepository
        name: portainer
  install:
    timeout: 5m
    remediation:
      retries: 2
  upgrade:
    timeout: 5m
    remediation:
      retries: 2
  values:
    replicaCount: 1

    enterpriseEdition:
      enabled: false

    image:
      repository: portainer/portainer-ce
      tag: 2.39.4
      pullPolicy: IfNotPresent

    localMgmt: true

    service:
      type: ClusterIP
      httpPort: 9000
      httpsPort: 9443
      edgePort: 8000

    tls:
      force: false

    trusted_origins:
      enabled: true
      domains: portainer.${SECRET_DOMAIN}

    ingress:
      enabled: false

    adminPassword:
      existingSecret: portainer-admin

    dbEncryption:
      existingSecret: ""

    persistence:
      enabled: true
      size: 10Gi
      storageClass: local-path
      accessMode: ReadWriteOnce
      existingClaim: ""

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1Gi
