name: SMPRules
version: 2.0.0
main: dev.glitg.smp.SMPRules
api-version: '26.1'
description: Small compatibility rules for GLITG SMP.
authors: [GLITG]
depend: [LifeStealZ]
softdepend: [ItemBlocker, KaiCore]
commands:
  smprules:
    description: GLITG SMP administration
    usage: /smprules <status|season|grace|end|locator>
permissions:
  smprules.admin:
    default: op
  smprules.bypass:
    default: false
