---
name: "GLITG SMP Image"

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/glitg-smp-image.yaml"
      - ".dockerignore"
      - "smprules/**"
      - "kubernetes/apps/games/glitg-smp/image/**"
      - "kubernetes/apps/games/glitg-smp/config/**"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Authenticate to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and publish
        run: |
          docker build -f kubernetes/apps/games/glitg-smp/image/Dockerfile -t ghcr.io/${{ github.repository_owner }}/glitg-smp:1.0.4 .
          docker push ghcr.io/${{ github.repository_owner }}/glitg-smp:1.0.4
